---
name: release
run-name: release ${{ github.ref_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
    - name: Reject disallowed branch
      if: >-
        ${{ github.event_name == 'workflow_dispatch'
        && github.ref != 'refs/heads/main' }}
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        echo "::error::Releases must run from main (got $REF_NAME)"
        exit 1

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Read version from package.json
      id: version
      run: |
        version=$(jq -r .version package.json)
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "::error::No version found in package.json"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Verify tag matches package.json version
      if: ${{ github.event_name == 'release' }}
      env:
        VERSION: ${{ steps.version.outputs.version }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        tag=${TAG#v}
        if [ "$tag" != "$VERSION" ]; then
          echo "::error::Release tag $TAG does not match package.json" \
            "version $VERSION"
          exit 1
        fi

    - name: Fail if release already exists
      if: ${{ github.event_name == 'workflow_dispatch' }}
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
          echo "::error::Release $VERSION already exists"
          exit 1
        fi

    - name: Fail if tag already exists
      if: ${{ github.event_name == 'workflow_dispatch' }}
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "::error::Tag $VERSION already exists (possibly on a" \
            "different commit); refusing to move it"
          exit 1
        fi

    - name: Install NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Pack tarball
      id: pack
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        npm pack --ignore-scripts
        tarball="scality-fcntl-$VERSION.tgz"
        if [ ! -f "$tarball" ]; then
          echo "::error::expected $tarball, got: $(echo *.tgz)"
          exit 1
        fi
        echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        tar -tzf "$tarball"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: '*.tgz'

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: '*.tgz'
        if-no-files-found: error
        retention-days: 7

  verify:
    name: install from tarball (node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download package artifact
      uses: actions/download-artifact@v8
      with:
        name: package

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    # tests.yaml only ever builds the worktree; this builds the packed sources,
    # which is what consumers actually compile. It is also what guards the files
    # allow-list: npm never includes binding.gyp on its own, and a tarball
    # missing it publishes fine, then dies in node-gyp at every consumer, on a
    # version that can never be republished.
    - name: Install the packed tarball
      env:
        TARBALL: ${{ needs.build.outputs.tarball }}
      run: |
        mkdir "$RUNNER_TEMP/consumer"
        cd "$RUNNER_TEMP/consumer"
        npm init -y >/dev/null
        npm install --no-audit --no-fund --foreground-scripts \
          "$GITHUB_WORKSPACE/$TARBALL"
        test -f node_modules/@scality/fcntl/build/Release/fcntl.node
        cp "$GITHUB_WORKSPACE/test/smoke.js" .

    - name: Load the addon
      run: |
        cd "$RUNNER_TEMP/consumer"
        FCNTL_MODULE=@scality/fcntl node smoke.js

    # Consumers keep require('fcntl'): the npm: alias installs this package at
    # node_modules/fcntl, the layout reproduced here.
    - name: Load the addon under the bare fcntl key
      run: |
        cd "$RUNNER_TEMP/consumer"
        cp -r node_modules/@scality/fcntl node_modules/fcntl
        FCNTL_MODULE=fcntl node smoke.js

  publish-github:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v8
      with:
        name: package

    - name: Install NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@scality'

    - name: Publish to GitHub Packages
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        if [ -n "$(npm view "@scality/fcntl@$VERSION" version 2>/dev/null)" ]; then
          echo "::notice::@scality/fcntl@$VERSION already on GitHub Packages; skipping"
        else
          npm publish *.tgz --tag latest
        fi

  publish-npm:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v8
      with:
        name: package

    # Node 24 for npm >= 11.5: publishing is OIDC trusted publishing, with no
    # stored token, and the npm 10.x bundled with Node 22 cannot do it.
    - name: Install NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        scope: '@scality'

    - name: Publish to npm
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        if [ -n "$(npm view "@scality/fcntl@$VERSION" version 2>/dev/null)" ]; then
          echo "::notice::@scality/fcntl@$VERSION already on npm; skipping"
        else
          npm publish *.tgz --provenance --tag latest
        fi

  release:
    needs: [build, publish-github, publish-npm]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
    - name: Create Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        name: ${{ needs.build.outputs.version }}
        tag_name: ${{ needs.build.outputs.version }}
        generate_release_notes: true
        append_body: true
        body: |
          GitHub Packages: https://github.com/${{ github.repository }}/pkgs/npm/fcntl
          npm: https://www.npmjs.com/package/@scality/fcntl
        target_commitish: ${{ github.sha }}
