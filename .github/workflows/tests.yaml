---
name: tests

on:
  push:
    branches-ignore:
    - 'development/**'
    - 'q/*/**'

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: build the addon
      run: yarn install --frozen-lockfile
    - name: load the addon
      run: yarn test
